# The form of the piece.
# The generator may create forms in forms for a more moving
# piece of music.
# 
# Meanings:
# - "A"           : Any letter will be converted into a section.
# - "A%"          : Optional section.
# - "A+"          : Regenerated with same theme, same section structure.
# - "A*"          : Regenerated with same theme, different structure.
# - "Intro"       : Will generate a introduction section.
# - "Development" : Will generate a section with all themes.

binary: [A, B]

ternary: [A, B, A+]
ternary_repeated: [A, B, A]

sonata_standard: [Intro%, A, B, Development, A+, B+, Coda%]
sonata_rachmaninov: [Intro%, A, B, Development, B+, A*, Coda%]
